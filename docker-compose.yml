version: '3.8'

services:
  tara3d-geodetic-engine:
    build: .
    container_name: tara3d_mission_node
    ports:
      - "8000:8000"
      - "8080:8080"
    volumes:
      - ./outputs:/app/outputs
      - ./weights:/app/weights
    environment:
      - HF_HUB_OFFLINE=1
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
