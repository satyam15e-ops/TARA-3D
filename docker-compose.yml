version: '3.8'

services:
  backend:
    build: .
    container_name: tara3d-backend
    ports:
      - "8000:8000"
    volumes:
      - ./outputs:/app/outputs
    restart: unless-stopped

  frontend:
    image: nginx:alpine
    container_name: tara3d-frontend
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - backend
    restart: unless-stopped
