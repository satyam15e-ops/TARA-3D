<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>TARA-3D | Real-Time 3D Mesh Viewer</title>
  <style>
    body { margin: 0; overflow: hidden; background: #0b0f19; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    #canvas-container { width: 100vw; height: 100vh; }
    #hud {
      position: absolute; top: 16px; left: 16px;
      background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(10px);
      padding: 16px 20px; border-radius: 10px; border: 1px solid #334155;
      color: #fff; max-width: 320px; box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      z-index: 10;
    }
    h2 { font-size: 14px; margin: 0 0 8px 0; color: #38bdf8; text-transform: uppercase; letter-spacing: 0.5px; }
    p { font-size: 12px; margin: 4px 0; color: #94a3b8; }
    .upload-btn {
      display: block; margin-top: 12px; padding: 10px 14px;
      background: #0284c7; color: white; border-radius: 6px; font-size: 12px;
      cursor: pointer; font-weight: 600; text-align: center; border: none; width: 100%; box-sizing: border-box;
    }
    .upload-btn:hover { background: #0369a1; }
    input[type="file"] { display: none; }
    #telemetry { margin-top: 12px; border-top: 1px solid #334155; padding-top: 8px; font-size: 11px; color: #cbd5e1; }
    #telemetry div { margin: 3px 0; }
  </style>
</head>
<body>
  <div id="hud">
    <h2>TARA-3D Surface Mesh</h2>
    <p>Status: <span id="status-text" style="color: #4ade80;">Ready</span></p>
    <p>Orbit: Left Click + Drag | Zoom: Scroll</p>
    
    <label class="upload-btn">
      Upload Satellite Image
      <input type="file" id="file-input" accept="image/*">
    </label>

    <div id="telemetry">
      <div>Min Elevation: <span id="min-elev">--</span></div>
      <div>Max Elevation: <span id="max-elev">--</span></div>
      <div>Scale Factor: <span id="scale-val">--</span></div>
    </div>
  </div>
  <div id="canvas-container"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="js/viewer.js"></script>
</body>
</html>
